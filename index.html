<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max's GitHub Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inconsolata:wght@300;400;500&display=swap">
<style>
:root{--bg:#06090f;--surface:#0d1622;--s2:#142035;--c0:#0e1a28;--c1:#0a4030;--c2:#0a7058;--c3:#00c490;--c4:#00f5a0;--text:#b8cdd8;--muted:#3a5060;--accent:#00f5a0;--glow:rgba(0,245,160,.18);--border:rgba(255,255,255,.06);--cell:12px;--gap:3px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inconsolata','Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 24px 64px}
header{text-align:center;margin-bottom:52px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:12px}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3.4rem);color:#e8f4ff;line-height:1.1}
h1 span{color:var(--accent)}
.sub{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.graph-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 32px 24px;overflow-x:auto;max-width:100%}
.month-row{display:flex;gap:var(--gap);margin-bottom:8px;padding-left:28px}
.month-label{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;width:15px;flex-shrink:0}
.grid-outer{display:flex;gap:6px}
.day-labels{display:flex;flex-direction:column;gap:var(--gap);justify-content:space-around;padding-top:2px}
.day-label{font-size:9px;color:var(--muted);height:var(--cell);display:flex;align-items:center}
.grid{display:flex;gap:var(--gap)}
.week-col{display:flex;flex-direction:column;gap:var(--gap)}
.cell{width:var(--cell);height:var(--cell);border-radius:2px;background:var(--c0);transition:transform .15s,filter .15s;cursor:pointer;flex-shrink:0}
.cell[data-level="1"]{background:var(--c1)}
.cell[data-level="2"]{background:var(--c2)}
.cell[data-level="3"]{background:var(--c3);box-shadow:0 0 6px var(--glow)}
.cell[data-level="4"]{background:var(--c4);box-shadow:0 0 10px var(--glow),0 0 20px rgba(0,245,160,.08)}
.cell:hover{transform:scale(1.6);filter:brightness(1.3);z-index:10;position:relative}
.legend{display:flex;align-items:center;gap:6px;margin-top:18px;justify-content:flex-end}
.legend-label{font-size:10px;color:var(--muted)}
.legend-cell{width:11px;height:11px;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:28px;width:100%;max-width:720px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;text-align:center}
.stat-value{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:700;color:var(--accent);line-height:1;margin-bottom:6px}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tooltip{display:none;position:fixed;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text);pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip-count{color:var(--accent);font-weight:500}
.tip-date{color:var(--muted);font-size:10px;margin-top:2px}
footer{margin-top:40px;font-size:11px;color:var(--muted);letter-spacing:.06em}
footer a{color:var(--accent);text-decoration:none;opacity:.8}
footer a:hover{opacity:1}
</style>
</head>
<body>
<header>
  <p class="eyebrow">github.com / max777-cyber</p>
  <h1>Contribuicoes <span>2025-2026</span></h1>
  <p class="sub">Maximillian Benjamin Vicente - Sao Bernardo do Campo, SP</p>
</header>
<div class="graph-wrapper">
  <div class="month-row" id="monthRow"></div>
  <div class="grid-outer">
    <div class="day-labels">
      <div class="day-label"></div>
      <div class="day-label">Seg</div>
      <div class="day-label"></div>
      <div class="day-label">Qua</div>
      <div class="day-label"></div>
      <div class="day-label">Sex</div>
      <div class="day-label"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend">
    <span class="legend-label">Menos</span>
    <div class="legend-cell" style="background:var(--c0)"></div>
    <div class="legend-cell" style="background:var(--c1)"></div>
    <div class="legend-cell" style="background:var(--c2)"></div>
    <div class="legend-cell" style="background:var(--c3)"></div>
    <div class="legend-cell" style="background:var(--c4)"></div>
    <span class="legend-label">Mais</span>
  </div>
</div>
<div class="stats" id="stats"></div>
<footer>
  <a href="https://github.com/max777-cyber" target="_blank">github.com/max777-cyber</a>
  &nbsp;·&nbsp;
  <a href="https://linkedin.com/in/maximillian-benjamin-vicente" target="_blank">LinkedIn</a>
</footer>
<div class="tooltip" id="tooltip"><div class="tip-count" id="tipCount"></div><div class="tip-date" id="tipDate"></div></div>
<script>
const rawActivity={'2025-12-15':2,'2025-12-16':2,'2025-12-17':1,'2025-12-22':2,'2025-12-23':1,'2026-01-05':2,'2026-01-06':3,'2026-01-07':4,'2026-01-08':3,'2026-01-09':2,'2026-01-12':3,'2026-01-13':3,'2026-01-14':2,'2026-01-15':2,'2026-01-16':1,'2026-01-19':3,'2026-01-20':2,'2026-02-09':1,'2026-02-10':2,'2026-02-16':1,'2026-02-23':1,'2026-03-02':1,'2026-03-18':1,'2026-03-25':1,'2026-04-05':1,'2026-04-06':2,'2026-04-11':2,'2026-04-12':1,'2026-05-04':1,'2026-08-24':2,'2026-08-25':3,'2026-08-26':2,'2026-08-31':2,'2026-09-01':2,'2026-09-02':3,'2026-09-07':3,'2026-09-08':4};
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function fmt(d){return d.toISOString().slice(0,10)}
function fmtPT(d){return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const start=new Date('2025-09-08');start.setDate(start.getDate()-start.getDay());
const weeks=[];let c=new Date(start);
while(c<=new Date('2026-09-13')){const w=[];for(let i=0;i<7;i++){w.push(new Date(c));c.setDate(c.getDate()+1)}weeks.push(w)}
const monthRow=document.getElementById('monthRow');
let lastM=-1;
weeks.forEach(w=>{const m=w[3].getMonth();const s=document.createElement('div');s.className='month-label';if(m!==lastM){s.textContent=MONTHS[m];lastM=m}monthRow.appendChild(s)});
const grid=document.getElementById('grid');
const tooltip=document.getElementById('tooltip');
const tipCount=document.getElementById('tipCount');
const tipDate=document.getElementById('tipDate');
let total=0,daysOn=0;
const today=new Date();today.setHours(0,0,0,0);
weeks.forEach(week=>{
  const col=document.createElement('div');col.className='week-col';
  week.forEach(d=>{
    const cell=document.createElement('div');cell.className='cell';
    const key=fmt(d);const lv=rawActivity[key]||0;
    const cnt=lv;
    cell.dataset.level=lv;
    if(d>today){cell.style.opacity='.15';cell.style.pointerEvents='none'}
    else{total+=cnt;if(lv>0)daysOn++}
    cell.addEventListener('mouseenter',()=>{tipCount.textContent=cnt===0?'Sem contribuicoes':cnt+' contribuicao';tipDate.textContent=fmtPT(d);tooltip.style.display='block'});
    cell.addEventListener('mousemove',e=>{tooltip.style.left=(e.clientX+14)+'px';tooltip.style.top=(e.clientY-40)+'px'});
    cell.addEventListener('mouseleave',()=>{tooltip.style.display='none'});
    col.appendChild(cell);
  });
  grid.appendChild(col);
});
const sortedKeys=Object.keys(rawActivity).sort();
let streak=1,maxStreak=1;
for(let i=1;i<sortedKeys.length;i++){const diff=(new Date(sortedKeys[i])-new Date(sortedKeys[i-1]))/86400000;streak=diff===1?streak+1:1;if(streak>maxStreak)maxStreak=streak;}
const statsEl=document.getElementById('stats');
[{v:total,l:'Contribuicoes'},{v:daysOn,l:'Dias ativos'},{v:maxStreak+' dias',l:'Streak maximo'},{v:Object.keys(rawActivity).length,l:'Commits'}].forEach(item=>{
  const card=document.createElement('div');card.className='stat-card';
  card.innerHTML='<div class="stat-value">'+item.v+'</div><div class="stat-label">'+item.l+'</div>';
  statsEl.appendChild(card);
});
const cells=document.querySelectorAll('.cell');
cells.forEach((c,i)=>{
  const col=Math.floor(i/7);
  c.style.opacity='0';c.style.transform='scale(0.4)';
  c.style.transition='opacity .25s '+col*8+'ms,transform .25s '+col*8+'ms';
  setTimeout(()=>{c.style.transition='transform .15s,filter .15s';c.style.opacity=c.style.opacity==='.15'?'.15':'1';c.style.transform='scale(1)'},col*8+50);
});
</script>
</body>
</html>
